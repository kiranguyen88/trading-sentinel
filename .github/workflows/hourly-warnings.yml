name: Hourly Warnings Check

on:
  schedule:
    # Every hour Mon–Fri, 13:00–21:00 UTC = 9 AM–5 PM ET (US market hours)
    - cron: "0 13-21 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  check-warnings:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger check-warnings
        # --fail-with-body: a non-2xx fails the run and still prints the error JSON
        run: |
          curl -sS --fail-with-body "${{ secrets.APP_URL }}/cron/check-warnings" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60

  # GitHub disables scheduled workflows after 60 days without repo activity —
  # that silently stopped alerts once already. Re-enabling via the API resets
  # the timer without a commit (a commit to main would trigger a Vercel deploy).
  # Separate job so it still runs when the check above fails.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/hourly-warnings.yml/enable"
